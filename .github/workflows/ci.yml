name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  database-and-e2e:
    name: Migration, seed, policy tests, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Starts Postgres, Auth, the API and the Edge Functions runtime; applies supabase/migrations
      # and supabase/seed.sql. Services the tests do not need are left out to keep the job quick.
      - run: supabase start -x vector,imgproxy,storage-api,supavisor,studio,realtime,logflare
      - name: Row Level Security policy tests (pgTAP)
        run: supabase test db
      - name: Generated TypeScript types match the schema
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/database.types.ts || {
            echo "::error::src/lib/database.types.ts is out of date. Run: npm run db:types and commit the result."; exit 1; }
      - name: Serve the Edge Functions with the development env (codes are logged, not emailed)
        run: |
          nohup supabase functions serve --env-file supabase/functions/.env.development > functions-serve.log 2>&1 &
          for i in $(seq 1 30); do grep -q "Serving functions" functions-serve.log && break; sleep 2; done
          cat functions-serve.log
      - name: Point the app at the local stack and create the test logins
        run: |
          npm run db:env
          npm run db:users
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
        env:
          CI: 'true'
      - if: failure()
        run: |
          echo "::group::Edge Function logs"; docker logs supabase_edge_runtime_cds-pipeline-board 2>&1 | tail -200; echo "::endgroup::"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
